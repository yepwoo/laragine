name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [11, 12, 13]
        include:
          - laravel: 11
            testbench: ^9.0
          - laravel: 12
            testbench: ^10.0
          - laravel: 13
            testbench: ^11.0
          # one leg reports coverage, so it is not uploaded three times over
          - php: '8.3'
            laravel: 13
            coverage: true
        exclude:
          # testbench 11 (Laravel 13) requires PHP 8.3 or later
          - php: '8.2'
            laravel: 13

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      # Laravel 11 is EOL. Every tagged 11.x release is blocked by an unpatched
      # advisory (PKSA-mdq4-51ck-6kdq), so testbench cannot resolve the monolith
      # laravel/framework. Allow dev stability here only, to test against the
      # 11.x maintenance branch. The shipped composer.json stays stable-only, and
      # end users are unaffected: they depend on the illuminate/* split packages,
      # which carry no advisories.
      - name: Allow dev stability on the Laravel 11 leg
        if: matrix.laravel == 11
        run: composer config minimum-stability dev

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit
        if: ${{ !matrix.coverage }}

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-clover clover.xml
        if: ${{ matrix.coverage }}
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codacy
        if: ${{ matrix.coverage && env.CODACY_PROJECT_TOKEN != '' }}
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r clover.xml
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
